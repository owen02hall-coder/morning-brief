name: Data Smoke

# Diagnostic: proves every data leg (Yahoo, RSS, TradingView breadth scan, Wikipedia constituents,
# policy sources) works FROM A GITHUB RUNNER — CI egress IPs get blocked/limited in ways a home
# connection doesn't (the plan's load-bearing assumption gate for the unofficial TradingView
# endpoint). Writes nothing and publishes nothing; the ONLY thing it sends is a failure alert.
#
# The weekly schedule is the point, not a convenience. This was dispatch-only until 2026-08-03, and
# that is precisely why Nasdaq-100 breadth stayed dead for 22 days: Wikipedia moved the component
# table on 07-13, 04-external-boundary-smoke.py detected it correctly, and nobody ever ran the test.
# The guard existed; the trigger did not. A failed scheduled run emails the repo owner AND now pushes
# via ntfy (the final step) — email alone is the channel that gets ignored. Weekly (not daily)
# because these are slow-moving upstream shapes and a red run must stay a real signal.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 16 * * 1"   # Mondays ~10am America/Denver; GitHub may delay scheduled jobs by hours,
                           # which is fine — this is a drift detector, not a punctuality check.

permissions:
  contents: read

jobs:
  spine:
    runs-on: ubuntu-latest
    # 12, not 10: the job now runs eight assumption tests (05 fetches the Federal Register, the PMMS
    # CSV and Utah's passed-bills page; 07 fetches bill detail pages; 09 is offline and instant; 10
    # fetches ~50 Wikipedia articles, one per seed title; 14 fires two 8-request Wikipedia bursts; 04 reads 11 RSS feeds and both constituent tables) plus a real model call in 06.
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3 (SHA-pinned: mutable tags are a supply-chain vector in a push-capable job)

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0 (SHA-pinned)
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt -c constraints.txt

      - name: Print the data spine (all four numbers + breadth + news counts)
        id: spine
        run: |
          python -m scripts.build_briefing --spine | tee spine.txt
          grep -q "breadth: {'sp500': {'value'" spine.txt || { echo "::error::S&P breadth did not compute from the runner"; exit 1; }
          grep -q "'ndx100': {'value'" spine.txt || { echo "::error::Nasdaq-100 breadth did not compute from the runner"; exit 1; }

      # Runner-IP proof for the planned policy section: .gov hosts and le.utah.gov are exactly the
      # kind of surface that answers a home connection but blocks/limits cloud egress. Passing
      # locally proves the API contract only. Read-only; writes nothing outside the workspace.
      # if: always() on the diagnostic steps below — this job is a DRIFT DETECTOR, so one dead leg
      # must not mask the others. On 2026-08-03 the spine step failed and skipped the policy check
      # entirely, hiding whether .gov egress worked at all. Each leg now reports independently; the
      # job still goes red if any of them fails.
      # PYTHONPATH: the assumption tests do `from scripts import config` so the gate proves the
      # PRODUCTION query shape, not a drifting local copy. `python -m` cannot address these files —
      # the names start with digits and contain hyphens, and the directory has no __init__.py — so
      # the import path is the route.
      # THE TEST THIS WHOLE WORKFLOW'S SCHEDULE WAS ADDED FOR, and until 2026-08-31 the only place
      # it appeared in this file was the comment at the top describing the outage it caught. The
      # 08-03 fix gave data-smoke a weekly `schedule:` precisely so guards stop going unrun, wired up
      # every other test, and never added this one. The guard existed; the trigger did not — again,
      # written directly under the paragraph explaining why that is dangerous.
      #
      # Not redundant with the spine step above, which greps that breadth PRODUCED a number. A1 here
      # checks all ELEVEN RSS feeds individually, and nothing else in CI does: the spine prints
      # aggregate news counts, so one dead feed silently narrows the reader's news diet with no
      # signal at all. A2 is the assertion that actually caught the Nasdaq-100 drift — it checks the
      # constituent TABLES still parse to ~500/~100, which goes red earlier and more precisely than
      # waiting for MIN_MATCH to fail-close downstream.
      #
      # Keyless, read-only. NOTE the known trap recorded in 04's own header: it hardcodes its copy of
      # the feed URLs and wiki page names, so a change to config.py must be made in both places.
      - name: External boundary (11 RSS feeds alive; constituent tables still parse)
        id: boundary
        if: always()
        env:
          BRIEFING_SMOKE_ALLOW_DEV: "true"
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/briefing-assumptions/04-external-boundary-smoke.py

      - name: Policy sources reachable from the runner
        id: policy_sources
        if: always()
        env:
          BRIEFING_SMOKE_ALLOW_DEV: "true"
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/briefing-assumptions/05-policy-sources.py

      # The Utah bill DETAIL page is the riskiest parse in the policy leg: the passed-bills rows
      # carry relative hrefs, and the detail text is what the invented-figure guard compares against.
      - name: Utah bill detail (relative hrefs resolve; detail text extracts)
        id: utah_detail
        if: always()
        env:
          BRIEFING_SMOKE_ALLOW_DEV: "true"
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/briefing-assumptions/07-utah-bill-detail.py

      # The keyword prefilter decides what the model never sees. A silent recall regression here
      # (a \b that can never match, a missing inflection) deletes candidates with no visible symptom.
      - name: Prefilter recall (the keyword gate does not silently drop candidates)
        id: prefilter
        if: always()
        env:
          BRIEFING_SMOKE_ALLOW_DEV: "true"
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/briefing-assumptions/08-prefilter-recall.py

      # The static policy calendar is the one HARDCODED leg — nothing fetches it, so nothing can
      # report it broken. This step needs no network and no key; it is here because a rotted entry
      # renders exactly like a good one, and the weekly run is where a "someone edited config"
      # regression surfaces as a push instead of as a wrong date on the page.
      - name: Policy calendar (no entry can go stale, no label claims an unannounced date)
        id: calendar
        if: always()
        env:
          BRIEFING_SMOKE_ALLOW_DEV: "true"
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/briefing-assumptions/09-policy-calendar.py

      # Owen's Alphabet Soup is the only section with no feed behind its subject matter, so the
      # article fetch IS its accuracy guarantee — and a rotted seed title or a guard that stopped
      # matching produces a page that looks exactly as good as a working one. Keyless.
      - name: Lesson sources (seed articles resolve; the invented-figure guard still bites)
        id: lesson_sources
        if: always()
        env:
          BRIEFING_SMOKE_ALLOW_DEV: "true"
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/briefing-assumptions/10-lesson-sources.py

      # The 2026-08-31 regression this exists for: WIKI_UA ended in a bare "https://github.com/",
      # Wikimedia read that as unidentified, and throttled the lesson leg to 100% UNDER BURST while
      # a slow one-off fetch still succeeded. Alphabet Soup went dark for days behind a low-priority
      # "degraded sections" push that named no cause. 10 above fetches seeds and would go red too,
      # but only this one measures the User-Agent itself and controls with the old generic string,
      # so a PASS here means "not throttled" rather than "nobody is being throttled today".
      - name: Wikipedia User-Agent (policy-compliant, and survives a burst)
        id: wikipedia_ua
        if: always()
        env:
          BRIEFING_SMOKE_ALLOW_DEV: "true"
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/briefing-assumptions/14-wikipedia-ua.py

      # The lesson pointer is the only rule in this project enforced entirely in the browser — the
      # build CANNOT know whether the audio reached the end. A regression that advanced the pointer
      # on a pause would burn lessons the reader never heard, and no server-side check could ever
      # see it. Needs neither network nor key; the runner image ships Node.
      - name: Client pointer (a lesson advances only when the briefing actually finished)
        id: client_pointer
        if: always()
        env:
          BRIEFING_SMOKE_ALLOW_DEV: "true"
        run: node scripts/briefing-assumptions/11-client-pointer.js

      # The briefing is spoken by two hand-mirrored implementations — scripts/tts.py for the mp3 and
      # docs/app.js for the device voice. Nothing in production compares them, so a change made on
      # one side only turns a fallback day into a quietly different briefing. Needs neither network
      # nor key; runs Python and Node against each other.
      - name: Narration mirror (the mp3 script and the device-voice script say the same thing)
        id: narration
        if: always()
        env:
          BRIEFING_SMOKE_ALLOW_DEV: "true"
        run: python scripts/briefing-assumptions/12-narration-mirror.py

      # The US national section re-admits a category summarize.SYSTEM excluded outright until
      # 2026-08-20, so the narrower rule replacing that exclusion gets a machine. Uses the same
      # GEMINI_API_KEY as the briefing for its live half; C1/C2/C4 run without it.
      - name: US news editorial (events and outcomes, never the partisan contest)
        id: editorial
        if: always()
        env:
          BRIEFING_SMOKE_ALLOW_DEV: "true"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/briefing-assumptions/13-us-news-editorial.py

      # Relevance is the whole product: ~80% of agency-filtered Federal Register documents are
      # irrelevant to this user, so "did the model pick the right ones" is the assumption that
      # decides whether the policy section is worth shipping. Uses the GEMINI_API_KEY secret the
      # daily briefing already relies on — one model call per run. Seeded decoys make a
      # first-N-documents answer fail.
      - name: Policy relevance (model picks the right documents, invents no figures)
        id: relevance
        if: always()
        env:
          BRIEFING_SMOKE_ALLOW_DEV: "true"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/briefing-assumptions/06-policy-relevance.py

      # A scheduled red run only emails the repo owner, and email is exactly the channel that gets
      # ignored — which is how Nasdaq-100 breadth stayed dead for 22 days with a working guard in
      # place. This job IS the alarm, so it has to be able to ring.
      # `failure() || cancelled()`, not `failure()`: a timeout-minutes kill is a CANCELLATION, and
      # this job has a timeout — `failure()` alone would silently miss the slowest failure mode.
      # The secret is NTFY_SUB while the code reads env NTFY_TOPIC (briefing.yml:46-47);
      # `secrets.NTFY_TOPIC` would resolve to empty and the [ -n ] guard would skip without a word.
      # Hence the `else`: a guard that skips silently IS the dead alarm this step exists to prevent,
      # so an empty topic on a red run must annotate the run rather than report green and page nobody.
      # WHY THIS IS TWO CLASSES AND NOT ONE. Until 2026-08-31 every red run sent one high-priority
      # push saying "a data leg went red ... Check the Data Smoke run", whatever had actually
      # broken. On 08-17 that page fired for a transient Gemini 5xx, and on 08-31 it fired again
      # because a live news item happened to say "Republican". A pager that cannot tell a dead
      # source from a model having an opinion about today's news is a pager you learn to swipe
      # away — and the one it needs to survive is the Nasdaq-100-breadth-is-dead-for-22-days
      # kind. So:
      #
      #   SOURCE steps   a feed, a scrape, a fetch or a deterministic rule. If one of these is red
      #                  something is genuinely broken or has drifted, and it stays HIGH priority.
      #   JUDGMENT steps a live model call scored against whatever the world published today. These
      #                  flap. Still reported, still turns the RUN red (the run is the durable
      #                  record and must not lie), but pushes at LOW priority and says so.
      #
      # The run being red is deliberately NOT softened with continue-on-error: a green checkmark
      # over a failed assertion is how a guard rots. Only the interruption is graded.
      - name: Alert on a red data-smoke run (nothing else pages on this)
        if: failure() || cancelled()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_SUB }}
          SPINE: ${{ steps.spine.outcome }}
          BOUNDARY: ${{ steps.boundary.outcome }}
          POLICY_SOURCES: ${{ steps.policy_sources.outcome }}
          UTAH_DETAIL: ${{ steps.utah_detail.outcome }}
          PREFILTER: ${{ steps.prefilter.outcome }}
          CALENDAR: ${{ steps.calendar.outcome }}
          LESSON_SOURCES: ${{ steps.lesson_sources.outcome }}
          WIKIPEDIA_UA: ${{ steps.wikipedia_ua.outcome }}
          CLIENT_POINTER: ${{ steps.client_pointer.outcome }}
          NARRATION: ${{ steps.narration.outcome }}
          EDITORIAL: ${{ steps.editorial.outcome }}
          RELEVANCE: ${{ steps.relevance.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # A step that never ran (an earlier one cancelled the job) reports "" or "skipped" and must
          # not be counted as broken — only an explicit "failure" is a failure.
          bad_sources=""
          bad_judgment=""
          # `return 0` is load-bearing: this step runs under `bash -e`, and a bare `[ ] && x`
          # exits non-zero when the test is false, which would abort the alert before it pages.
          src() { [ "$1" = failure ] && bad_sources="$bad_sources $2"; return 0; }
          jdg() { [ "$1" = failure ] && bad_judgment="$bad_judgment $2"; return 0; }
          src "$SPINE"          "market-spine"
          src "$BOUNDARY"       "external-boundary"
          src "$POLICY_SOURCES" "policy-sources"
          src "$UTAH_DETAIL"    "utah-detail"
          src "$PREFILTER"      "prefilter"
          src "$CALENDAR"       "policy-calendar"
          src "$LESSON_SOURCES" "lesson-sources"
          src "$WIKIPEDIA_UA"   "wikipedia-user-agent"
          src "$CLIENT_POINTER" "client-pointer"
          src "$NARRATION"      "narration-mirror"
          jdg "$EDITORIAL"      "us-news-editorial"
          jdg "$RELEVANCE"      "policy-relevance"
          bad_sources="${bad_sources# }"; bad_judgment="${bad_judgment# }"

          if [ -n "$bad_sources" ]; then
            title="Data smoke FAILED"; prio="high"
            body="A DATA SOURCE went red from the runner: ${bad_sources}. Something is broken or has drifted upstream."
            [ -n "$bad_judgment" ] && body="${body} (Also flapping, lower stakes: ${bad_judgment}.)"
          elif [ -n "$bad_judgment" ]; then
            title="Data smoke: a judgment test flapped"; prio="low"
            body="Every data source is HEALTHY. Only a live model-scored check went red: ${bad_judgment}. These depend on whatever the world published today, so this is usually not a regression — worth a look, not worth your morning."
          else
            # Red with no failed step of either class: a cancel, a timeout, or a step this alert does
            # not know about. Fail loud rather than guess — silence here would be the bug.
            title="Data smoke FAILED"; prio="high"
            body="The run went red but no known step reported failure — it was cancelled, timed out, or a new step is missing from the alert's step list."
          fi

          if [ -n "${NTFY_TOPIC}" ]; then
            curl -s -H "Title: ${title}" -H "Priority: ${prio}" -H "Click: ${RUN_URL}"               -d "${body}" "https://ntfy.sh/${NTFY_TOPIC}" || true
            echo "paged: [${prio}] ${title} — ${body}"
          else
            echo "::error::Data smoke went red and NTFY_TOPIC was EMPTY — this run paged NOBODY. The NTFY_SUB repo secret is missing, renamed or rotated; restore it under exactly that name (the workflow maps secrets.NTFY_SUB -> NTFY_TOPIC)."
          fi
